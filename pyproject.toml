[project]
name = "marketplace"
version = "0.1.0"
description = "Marketplace API"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.18.4",
    "asyncpg==0.31.0",
    "fastapi==0.135.3",
    "starlette==1.0.0",
    "pydantic==2.12.5",
    "sqlalchemy==2.0.49",
    "uvicorn==0.44.0",
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-asyncio==1.3.0",
    "pytest-xdist==3.8.0",
    "mypy==1.20.2",
    "pre-commit==4.6.0",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "greenlet==3.4.0",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
exclude = [".venv", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = [
    "B",
    "I",
    "F",
    "E",
    "W",
    "UP",
    "ASYNC"
]
ignore = [
    "B904",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query"
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]
